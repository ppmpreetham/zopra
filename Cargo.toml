[package]
name = "zopra"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A reactive framework for GPUI"
repository = "https://github.com/ppmpreetham/zopra"
readme = "README.md"
keywords = ["ui", "gpui", "macros", "declarative"]
categories = ["gui"]

[workspace]
members = ["zopra_macros"]

[dev-dependencies]
gpui-kit = { version = "0.6", features = ["test-support"] }
gpui-rsx = {git = "https://www.github.com/ppmpreetham/gpui-rsx"}

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
gpui-kit = "0.6"
parking_lot = "0.12.5"
rust-embed = "8.12.0"
zopra_macros = { path = "./zopra_macros", version = "0.1.0" }
